<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>기록 챗봇 · 자비스 기록</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body[data-theme="concierge"]{--bg:oklch(0.985 0.007 75);--card:#ffffff;--text:oklch(0.24 0.01 60);--text2:oklch(0.55 0.02 60);--border:oklch(0.92 0.008 70);--btn-bg:oklch(0.62 0.13 45);--btn-text:#fff;--arrive:oklch(0.5 0.11 150);--depart:oklch(0.58 0.16 30);--ok-bg:oklch(0.95 0.04 150);--ok-text:oklch(0.42 0.11 150);--err-bg:oklch(0.95 0.045 30);--err-text:oklch(0.5 0.16 30);--meta-bg:oklch(0.97 0.006 70);--shadow:0 1px 3px rgba(60,40,20,0.08);--radius:18px;--input-radius:12px;--font:'Pretendard',sans-serif;--head:'Pretendard',sans-serif;--mono:'JetBrains Mono',monospace;--page:oklch(0.955 0.006 70);--grid:none;--accent:oklch(0.62 0.13 45);--label-tt:uppercase;--label-sp:0.5px;}
    body[data-theme="hud"]{--bg:oklch(0.15 0.012 250);--card:oklch(0.19 0.012 250);--text:oklch(0.92 0.01 220);--text2:oklch(0.6 0.02 220);--border:oklch(0.34 0.02 220);--btn-bg:oklch(0.78 0.13 200);--btn-text:oklch(0.15 0.012 250);--arrive:oklch(0.82 0.13 200);--depart:oklch(0.72 0.16 25);--ok-bg:oklch(0.3 0.05 200);--ok-text:oklch(0.85 0.13 200);--err-bg:oklch(0.3 0.08 25);--err-text:oklch(0.82 0.14 25);--meta-bg:oklch(0.22 0.012 250);--shadow:0 0 0 1px oklch(0.3 0.02 220);--radius:10px;--input-radius:8px;--font:'Pretendard',sans-serif;--head:'Space Grotesk',sans-serif;--mono:'JetBrains Mono',monospace;--page:oklch(0.1 0.01 250);--grid:linear-gradient(oklch(0.2 0.012 250) 1px,transparent 1px),linear-gradient(90deg,oklch(0.2 0.012 250) 1px,transparent 1px);--accent:oklch(0.78 0.13 200);--label-tt:uppercase;--label-sp:1.5px;}
    body[data-theme="calm"]{--bg:oklch(0.985 0.003 255);--card:oklch(0.985 0.003 255);--text:oklch(0.26 0.01 255);--text2:oklch(0.58 0.01 255);--border:oklch(0.9 0.004 255);--btn-bg:oklch(0.5 0.06 155);--btn-text:#fff;--arrive:oklch(0.5 0.09 150);--depart:oklch(0.55 0.1 30);--ok-bg:oklch(0.96 0.02 155);--ok-text:oklch(0.42 0.07 155);--err-bg:oklch(0.96 0.02 30);--err-text:oklch(0.5 0.12 30);--meta-bg:oklch(0.97 0.003 255);--shadow:none;--radius:14px;--input-radius:12px;--font:'Pretendard',sans-serif;--head:'Space Grotesk',sans-serif;--mono:'Space Grotesk',sans-serif;--page:oklch(0.965 0.003 255);--grid:none;--accent:oklch(0.5 0.06 155);--label-tt:none;--label-sp:0;}
    body[data-theme="apple"]{--bg:#ffffff;--card:#ffffff;--text:oklch(0.2 0.003 255);--text2:oklch(0.53 0.006 255);--border:oklch(0.91 0.003 255);--btn-bg:oklch(0.58 0.19 260);--btn-text:#fff;--arrive:oklch(0.66 0.17 145);--depart:oklch(0.63 0.22 25);--ok-bg:oklch(0.95 0.05 145);--ok-text:oklch(0.45 0.14 145);--err-bg:oklch(0.95 0.05 25);--err-text:oklch(0.52 0.19 25);--meta-bg:oklch(0.965 0.003 255);--shadow:0 1px 2px rgba(0,0,0,0.04),0 6px 20px rgba(0,0,0,0.06);--radius:20px;--input-radius:14px;--font:-apple-system,BlinkMacSystemFont,'SF Pro Display','Pretendard',sans-serif;--head:-apple-system,BlinkMacSystemFont,'SF Pro Display','Pretendard',sans-serif;--mono:'SF Mono','JetBrains Mono',monospace;--page:oklch(0.975 0.002 255);--grid:none;--accent:oklch(0.58 0.19 260);--label-tt:none;--label-sp:0;}

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body{background:var(--page);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;transition:background .25s,color .25s;}
    .mono{font-family:var(--mono);}
    .container{max-width:600px;margin:0 auto;padding:18px 18px 60px;background-image:var(--grid);background-size:26px 26px;min-height:100vh;position:relative;}

    /* 헤더 */
    .header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;position:relative;z-index:2;flex-wrap:wrap;}
    .brand{display:flex;align-items:center;gap:7px;font-family:var(--head);font-weight:700;font-size:16px;letter-spacing:-0.01em;}
    .icon-btn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:var(--input-radius);padding:8px 11px;font-size:13px;cursor:pointer;text-decoration:none;display:inline-block;font-family:var(--font);}

    /* 카드 */
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;z-index:2;}
    h2{font-size:12px;font-weight:700;color:var(--text2);text-transform:var(--label-tt);letter-spacing:var(--label-sp);margin-bottom:12px;font-family:var(--font);}
    body[data-theme="hud"] h2{color:var(--accent);font-family:var(--mono);}
    body[data-theme="hud"] h2::before{content:'> ';}

    /* 토큰 배너 */
    .token-banner{background:var(--card);border:1px solid var(--accent);border-radius:var(--radius);padding:14px;margin-bottom:14px;font-size:13px;color:var(--text);position:relative;z-index:2;}
    .token-banner input{width:100%;margin-top:8px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--input-radius);font-size:13px;font-family:var(--mono);background:var(--card);color:var(--text);}
    .token-banner button{margin-top:8px;padding:7px 16px;background:var(--btn-bg);color:var(--btn-text);border:none;border-radius:var(--input-radius);font-size:13px;cursor:pointer;font-family:var(--font);}

    /* 인풋 */
    .row{display:flex;gap:8px;margin-bottom:10px;}
    input[type=text]{padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--input-radius);font-size:14px;background:var(--card);color:var(--text);font-family:var(--font);width:100%;}
    input:focus{outline:none;border-color:var(--accent);}

    /* 전송 버튼 */
    .send-btn{width:100%;padding:12px;background:var(--btn-bg);color:var(--btn-text);border:none;border-radius:var(--input-radius);font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);}
    .send-btn:active{opacity:.85;}
    body[data-theme="hud"] .send-btn{font-family:var(--mono);letter-spacing:1px;}

    /* 챗봇 — 카카오톡 스타일 */
    #idxStatus{float:right;font-size:11px;color:var(--text2);font-weight:400;text-transform:none;letter-spacing:0;font-family:var(--mono);}
    .chat-log{max-height:56vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:12px 8px;margin-bottom:10px;background:#b2c7da;border-radius:var(--input-radius);}
    .bubble-row{display:flex;align-items:flex-end;gap:6px;max-width:100%;}
    .bubble-row.user{align-self:flex-end;flex-direction:row-reverse;}
    .bubble-row.bot{align-self:flex-start;}
    .avatar{flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:#ffe14d;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 1px 2px rgba(0,0,0,0.15);}
    .bubble-time{flex:0 0 auto;font-size:10px;color:#4a4a4a;white-space:nowrap;padding-bottom:2px;}
    .bubble{max-width:220px;padding:9px 12px;font-size:14px;line-height:1.5;word-break:break-word;box-shadow:0 1px 1px rgba(0,0,0,0.08);}
    .bubble.user{background:#fee500;color:#3c1e1e;border-radius:15px 3px 15px 15px;}
    .bubble.bot{background:#ffffff;color:#222;border-radius:3px 15px 15px 15px;}
    .result-item{display:flex;flex-direction:column;gap:2px;padding:8px 10px;margin-top:6px;background:#f7f8fa;border:1px solid #e3e6ea;border-radius:10px;cursor:pointer;}
    .result-item:active{opacity:.8;}
    .result-meta{font-size:11px;color:#8a8a8a;font-family:var(--mono);}
    .result-text{font-size:13px;color:#222;}
    mark{background:var(--accent);color:var(--btn-text);border-radius:3px;padding:0 2px;}

    /* 결과 토스트 */
    #result{position:fixed;top:14px;left:50%;transform:translateX(-50%);width:calc(100% - 36px);max-width:564px;margin:0;padding:12px 16px;border-radius:var(--input-radius);font-size:13px;text-align:center;display:none;z-index:100;font-family:var(--font);box-shadow:var(--shadow);}
    #result.ok{background:var(--ok-bg);color:var(--ok-text);}
    #result.err{background:var(--err-bg);color:var(--err-text);}

    .footer{text-align:center;color:var(--text2);font-size:11px;padding:16px 0 20px;position:relative;z-index:2;}
    body[data-theme="hud"] .footer{font-family:var(--mono);}
  </style>
</head>
<body data-theme="concierge">
<div class="container">

  <!-- 헤더 -->
  <div class="header">
    <div class="brand"><span>🔎</span><span>기록 챗봇</span></div>
    <div style="display:flex;gap:6px;">
      <button class="icon-btn" onclick="toggleAiSettings()">🤖 AI 설정</button>
      <button class="icon-btn" onclick="buildIndex(true)">🔄 새로고침</button>
      <a class="icon-btn" href="index.html">← 돌아가기</a>
    </div>
  </div>

  <!-- AI 설정 패널 -->
  <div class="token-banner" id="aiSettings" style="display:none;">
    <strong>🤖 대화 AI 연결 (선택)</strong> — 키를 넣으면 검색 결과를 근거로 자연스럽게 답해줘요. 비워두면 키워드 검색만 동작해요.
    <div style="font-size:11px;color:var(--text2);margin-top:6px;">기본값은 Gemini 무료 키(OpenAI 호환) 기준이에요. <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" style="color:var(--accent);">무료 키 발급</a></div>
    <div style="font-size:11px;color:var(--err-text);margin-top:6px;">⚠️ 이 사이트는 공개 GitHub Pages예요. 키는 이 기기 브라우저에만 저장되고 서버로 전송되지 않지만, 남과 같이 쓰는 기기에서는 저장하지 마세요.</div>
    <input type="text" id="aiEndpointInput" placeholder="API 주소" style="margin-top:8px;">
    <input type="password" id="aiKeyInput" placeholder="API 키">
    <input type="text" id="aiModelInput" placeholder="모델명">
    <button onclick="saveAiSettings()">저장</button>
  </div>

  <!-- 토큰 배너 -->
  <div class="token-banner" id="tokenBanner">
    <strong>⚙️ 처음 한 번만:</strong> GitHub 토큰을 입력하세요.
    <input type="password" id="tokenInput" placeholder="ghp_...">
    <button onclick="saveToken()">저장</button>
  </div>

  <!-- 챗봇 -->
  <div class="card">
    <h2>🔎 기록 챗봇 <span id="idxStatus"></span></h2>
    <div id="chatLog" class="chat-log"></div>
    <div class="row" style="margin-bottom:0;">
      <input type="text" id="chatInput" placeholder="문장으로 적어보세요 (예: 신혜식당 갔다옴 / 보고서 끝냄 / 신혜식당 언제 갔어?)" onkeydown="if(event.key==='Enter')onSend()">
      <button class="send-btn" style="width:auto;padding:12px 18px;" onclick="onSend()">전송</button>
    </div>
  </div>

  <div id="result"></div>

  <div class="footer">기록 챗봇 · 키워드 검색 + (선택) AI 대화</div>
</div>

<script>
const REPO_OWNER = 'yamugyclaude';
const REPO_NAME  = 'jarvis-web';
const REF        = 'data';
const WORKFLOW   = 'location-log.yml';
const API_URL    = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/workflows/${WORKFLOW}/dispatches`;
const INDEX_KEY  = 'jarvis_search_index_v3';

// ── 기록 전송 (index.html/vehicle.html과 동일 패턴) ────────────
async function dispatch(inputs) {
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Authorization': `token ${getToken().replace(/[^\x20-\x7E]/g, '')}`, 'Accept': 'application/vnd.github+json' },
      body: JSON.stringify({ ref: REF, inputs }),
    });
    return res.status === 204 || res.ok;
  } catch (e) {
    return false;
  }
}

// ── 토큰 ──────────────────────────────────────────────────
function getToken() { return localStorage.getItem('jarvis_gh_token') || ''; }
function saveToken() {
  const val = document.getElementById('tokenInput').value.trim().replace(/[^\x20-\x7E]/g, '');
  if (!val) return;
  localStorage.setItem('jarvis_gh_token', val);
  document.getElementById('tokenBanner').style.display = 'none';
  showResult('✅ 토큰 저장 완료!', true);
  buildIndex(true);
}
function checkToken() {
  if (getToken()) { document.getElementById('tokenBanner').style.display = 'none'; return true; }
  document.getElementById('tokenBanner').style.display = 'block';
  return false;
}
function ghHeaders() {
  return { 'Authorization': `token ${getToken().replace(/[^\x20-\x7E]/g, '')}`, 'Accept': 'application/vnd.github+json' };
}

// ── 검색 인덱스 (일지 + 장소) ──────────────────────────────
// 항목: { date:'YYYY-MM-DD', time:'HH:MM', text, kind:'diary'|'log'|'place' }
let _index = [];
// 저장된 장소 DB: { 이름: {cat, lat, lng, created_at} } — 자연어 장소기록 라우팅에 사용
let _placeDB = {};

function setStatus(msg) { document.getElementById('idxStatus').textContent = msg; }

// md 본문에서 검색 대상 라인 추출
function extractLines(md, date, items) {
  md.split('\n').forEach(raw => {
    const line = raw.trim();
    let m;
    if ((m = line.match(/^-\s+(\d{1,2}:\d{2})\s+(.+)$/))) {
      items.push({ date, time: m[1], text: m[2].trim(), kind: 'diary' });
    } else if ((m = line.match(/^>\s*📍\s*(\d{1,2}:\d{2})\s*[—–-]\s*(.+)$/))) {
      items.push({ date, time: m[1], text: m[2].trim(), kind: 'log' });
    } else if ((m = line.match(/^-\s+(.+)$/))) {
      // 시간(HH:MM) 없이 적은 불릿도 인덱싱 (예: "- 장어구이", "- 죽림 수정돼지국밥")
      items.push({ date, time: '', text: m[1].trim(), kind: 'diary' });
    }
  });
}

function decodeContent(b64) {
  return decodeURIComponent(escape(atob(b64.replace(/\n/g, ''))));
}

// diary/{year}/{month}/*.md 경로를 Contents API로만 순회 (Git Trees API는 파인그레인드
// 토큰에서 401이 날 수 있어 쓰지 않음 — 다른 페이지들과 동일하게 Contents API로 통일)
async function listDiaryFiles() {
  const base = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents`;
  const listDir = async (path) => {
    const r = await fetch(`${base}/${path}?ref=${REF}`, { headers: ghHeaders() });
    if (r.status === 404) return [];
    if (!r.ok) throw new Error(`${r.status}`);
    return r.json();
  };
  const years = (await listDir('diary')).filter(e => e.type === 'dir');
  const monthLists = await Promise.all(years.map(y => listDir(y.path)));
  const months = monthLists.flat().filter(e => e.type === 'dir');
  const fileLists = await Promise.all(months.map(m => listDir(m.path)));
  return fileLists.flat().filter(e => e.type === 'file' && /\.md$/.test(e.name));
}

async function buildIndex(force) {
  if (!checkToken()) return;
  // 캐시 우선 표시(빠른 첫 화면)
  const cached = safeParse(localStorage.getItem(INDEX_KEY));
  if (!force && cached && Array.isArray(cached.items)) {
    _index = cached.items;
    setStatus(`준비됨 · ${_index.length}건`);
  } else {
    setStatus('⏳ 불러오는 중...');
  }

  try {
    // 1) diary 파일 목록(경로+sha) 확보
    let files;
    try {
      files = await listDiaryFiles();
    } catch (e) {
      const code = e.message;
      setStatus(`오류 ${code}`);
      if (!_index.length) {
        const hint = code === '401' ? ' — 토큰이 만료됐거나 잘못됐을 수 있어요. 새 토큰으로 다시 저장해 보세요.' : '';
        showResult(`❌ 불러오기 오류 ${code}${hint}`, false);
      }
      return;
    }
    // 파일 sha들을 정렬해 이어붙인 값 = 캐시 무효화 판단용 지문
    const fingerprint = files.map(f => f.sha).sort().join(',');

    // 캐시가 최신이면 재빌드 생략
    if (!force && cached && cached.fingerprint === fingerprint && Array.isArray(cached.items)) {
      _index = cached.items;
      setStatus(`준비됨 · ${_index.length}건`);
      return;
    }
    setStatus('⏳ 불러오는 중...');

    const diaryPaths = files.map(f => f.path);

    const items = [];
    // 2) 각 diary md
    await Promise.all(diaryPaths.map(async path => {
      try {
        const u = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}?ref=${REF}`;
        const r = await fetch(u, { headers: ghHeaders() });
        if (!r.ok) return;
        const d = await r.json();
        const text = decodeContent(d.content);
        const dm = path.match(/(\d{4}-\d{2}-\d{2})\.md$/);
        extractLines(text, dm ? dm[1] : '', items);
      } catch (e) { /* 이 파일만 스킵 */ }
    }));

    // 3) places.json
    try {
      const pu = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/places.json?ref=${REF}`;
      const pr = await fetch(pu, { headers: ghHeaders() });
      if (pr.ok) {
        const pd = await pr.json();
        const places = (JSON.parse(decodeContent(pd.content)).places) || {};
        _placeDB = places;
        Object.entries(places).forEach(([name, p]) => {
          items.push({
            date: (p.created_at || '').slice(0, 10),
            time: '',
            text: `📍 ${name}${p.cat ? ' · ' + p.cat : ''}`,
            kind: 'place'
          });
        });
      }
    } catch (e) { /* 장소 없으면 스킵 */ }

    _index = items;
    localStorage.setItem(INDEX_KEY, JSON.stringify({ fingerprint, items, built_at: Date.now() }));
    setStatus(`준비됨 · ${items.length}건`);
    if (force) showResult(`✅ 새로고침 완료 · ${items.length}건`, true);
  } catch (e) {
    setStatus('오류');
    if (!_index.length) showResult(`❌ 오류: ${e.message}`, false);
  }
}

function safeParse(s) { try { return JSON.parse(s); } catch (e) { return null; } }

// ── 대화 AI 설정 (OpenAI 호환 API — 기본값 Gemini 무료) ──────────
const AI_DEFAULT_ENDPOINT = 'https://generativelanguage.googleapis.com/v1beta/openai/chat/completions';
const AI_DEFAULT_MODEL    = 'gemini-2.0-flash';

function getAiSettings() {
  return {
    endpoint: localStorage.getItem('jarvis_ai_endpoint') || AI_DEFAULT_ENDPOINT,
    key: localStorage.getItem('jarvis_ai_key') || '',
    model: localStorage.getItem('jarvis_ai_model') || AI_DEFAULT_MODEL,
  };
}
function toggleAiSettings() {
  const el = document.getElementById('aiSettings');
  const show = el.style.display === 'none';
  el.style.display = show ? 'block' : 'none';
  if (show) {
    const s = getAiSettings();
    document.getElementById('aiEndpointInput').value = s.endpoint;
    document.getElementById('aiKeyInput').value = localStorage.getItem('jarvis_ai_key') || '';
    document.getElementById('aiModelInput').value = s.model;
  }
}
function saveAiSettings() {
  const endpoint = document.getElementById('aiEndpointInput').value.trim() || AI_DEFAULT_ENDPOINT;
  const key = document.getElementById('aiKeyInput').value.trim();
  const model = document.getElementById('aiModelInput').value.trim() || AI_DEFAULT_MODEL;
  localStorage.setItem('jarvis_ai_endpoint', endpoint);
  localStorage.setItem('jarvis_ai_key', key);
  localStorage.setItem('jarvis_ai_model', model);
  document.getElementById('aiSettings').style.display = 'none';
  showResult(key ? '✅ AI 연결 저장됨 — 이제 대화로 답해드려요.' : '✅ 저장됨 (키 없음 — 검색만 동작해요)', true);
}

// 검색된 기록을 근거로 자연어 답변 생성. 실패 시 { ok:false, error } 반환.
async function callAI(question, items) {
  const s = getAiSettings();
  const context = items.slice(0, 15)
    .map(it => `- ${it.date}${it.time ? ' ' + it.time : ''} ${it.text}`)
    .join('\n');
  const systemPrompt = '당신은 사용자의 개인 기록(자비스 일지) 비서입니다. 아래 [관련 기록]에 있는 내용만 근거로 자연스럽고 간결한 한국어로 답변하세요. 기록에 없는 내용은 추측하지 말고 모른다고 답하세요.\n\n[관련 기록]\n' + context;
  try {
    const res = await fetch(s.endpoint, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${s.key}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: s.model,
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: question },
        ],
      }),
    });
    const data = await res.json().catch(() => null);
    if (!res.ok) {
      // Gemini의 OpenAI 호환 엔드포인트는 오류를 배열([{error:{...}}])로 감싸서 줄 때가 있음
      const errObj = Array.isArray(data) ? data[0] : data;
      const msg = errObj && errObj.error && errObj.error.message ? errObj.error.message : `HTTP ${res.status}`;
      return { ok: false, error: msg };
    }
    const text = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    if (!text) return { ok: false, error: '빈 응답' };
    return { ok: true, text: text.trim() };
  } catch (e) {
    return { ok: false, error: e.message };
  }
}

// ── 검색 (단순 키워드 AND) ─────────────────────────────────
const STOP = new Set(['언제','어디','어디서','어디에','뭐','무엇','몇','누구','왜','어떻게','했어','했나','한','하는','거','수','좀','그','저','이','것','있어','있나','있었','간','갔어','갔나','갔었','나','내','더','때','날','적','또']);

function tokenize(q) {
  const raw = q.toLowerCase().replace(/[?!.,~/()\[\]"']/g, ' ').split(/\s+/).map(t => t.trim()).filter(Boolean);
  const meaningful = raw.filter(t => !STOP.has(t));
  return meaningful.length ? meaningful : raw;   // 전부 불용어면 원본 사용
}

function searchWith(tokens) {
  const byDate = (a, b) => (b.date + ' ' + b.time).localeCompare(a.date + ' ' + a.time);
  // 1차: 모든 단어 포함(AND) — 정확
  let matched = _index.filter(it => { const h = it.text.toLowerCase(); return tokens.every(t => h.includes(t)); });
  let broadened = false;
  // 2차: AND 결과 없고 단어가 여러 개면 하나라도 포함(OR)으로 확장 — 문장 질문 대응
  if (!matched.length && tokens.length > 1) {
    matched = _index.filter(it => { const h = it.text.toLowerCase(); return tokens.some(t => h.includes(t)); });
    broadened = true;
  }
  matched.sort(byDate);
  return { items: matched.slice(0, 50), broadened };
}

// ── 챗봇 UI ───────────────────────────────────────────────
function escapeHtml(s) {
  return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
function highlight(text, tokens) {
  let h = escapeHtml(text);
  tokens.forEach(t => {
    if (!t) return;
    const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    h = h.replace(re, '<mark>$1</mark>');
  });
  return h;
}
function scrollBottom() {
  const log = document.getElementById('chatLog');
  log.scrollTop = log.scrollHeight;
}
function nowHHMM() {
  const d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function addBubbleRow(side, bubbleEl) {
  const row = document.createElement('div');
  row.className = 'bubble-row ' + side;
  const time = document.createElement('div');
  time.className = 'bubble-time';
  time.textContent = nowHHMM();
  if (side === 'bot') {
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = '🔎';
    row.appendChild(avatar);
    row.appendChild(bubbleEl);
    row.appendChild(time);
  } else {
    row.appendChild(bubbleEl);
    row.appendChild(time);
  }
  document.getElementById('chatLog').appendChild(row);
  scrollBottom();
  return row;
}
function addUserText(txt) {
  const div = document.createElement('div');
  div.className = 'bubble user';
  div.textContent = txt;
  addBubbleRow('user', div);
}
function addBotText(txt) {
  const div = document.createElement('div');
  div.className = 'bubble bot';
  div.textContent = txt;
  addBubbleRow('bot', div);
}
function renderResults(matched, tokens, isReference) {
  if (!matched.length) { addBotText('해당 기록이 없어요. 다른 단어로 검색해 보세요.'); return; }
  const wrap = document.createElement('div');
  wrap.className = 'bubble bot';
  wrap.style.maxWidth = '260px';
  const head = document.createElement('div');
  head.style.cssText = 'font-size:12px;color:#8a8a8a;margin-bottom:2px;';
  head.textContent = isReference ? `참고한 기록 ${matched.length}건` : `기록 ${matched.length}건`;
  wrap.appendChild(head);
  matched.forEach(it => {
    const row = document.createElement('div');
    row.className = 'result-item';
    if (it.date) row.addEventListener('click', () => { location.href = `index.html?date=${it.date}`; });
    const meta = document.createElement('div');
    meta.className = 'result-meta';
    meta.textContent = (it.date || '-') + (it.time ? ' · ' + it.time : '');
    const txt = document.createElement('div');
    txt.className = 'result-text';
    txt.innerHTML = highlight(it.text, tokens);
    row.appendChild(meta);
    row.appendChild(txt);
    wrap.appendChild(row);
  });
  addBubbleRow('bot', wrap);
}

// ── 자연어 자동기록 라우팅 (검색/장소방문/메모 3갈래) ──────────
const QUESTION_MARKERS = ['?', '？', '언제', '몇시', '며칠', '어디', '뭐', '무엇', '누구', '왜', '어떻게', '있었', '있나'];

function looksLikeQuestion(t) {
  return QUESTION_MARKERS.some(m => t.includes(m));
}

// 문장 안에 저장된 장소명이 있는지 찾는다. 1글자 이름은 오탐 위험이 커서 제외.
// 이름 뒤에 조사·동사·문장끝이 와야 인정 (예: "집중"의 "집"은 불인정, "집에"·"창고 갔다"는 인정)
function findKnownPlaceInText(t) {
  const names = Object.keys(_placeDB).filter(n => n.length >= 2);
  return names.find(name => {
    const idx = t.indexOf(name);
    if (idx === -1) return false;
    const after = t.slice(idx + name.length);
    return after === '' || /^\s/.test(after) || /^[.,!?~]/.test(after) ||
      /^(에서|으로|까지|에|도|는|은|을|를|만|갔|왔|도착|다녀|들렀)/.test(after);
  });
}

function classifyIntent(q) {
  if (looksLikeQuestion(q)) return { type: 'search' };
  const place = findKnownPlaceInText(q);
  if (place) return { type: 'place', place };
  return { type: 'memo' };
}

async function handlePlaceLog(name) {
  const p = _placeDB[name] || {};
  const inputs = { place: name };
  if (typeof p.lat === 'number' && typeof p.lng === 'number') {
    inputs.lat = String(p.lat);
    inputs.lng = String(p.lng);
  }
  addBotText('⏳ 기록 중...');
  const ok = await dispatch(inputs);
  removeLastBotText();
  addBotText(ok ? `✅ "${name}" 방문으로 기록했어요.` : '⚠️ 기록 전송에 실패했어요. 네트워크나 토큰을 확인해 주세요.');
}

async function handleMemoLog(text) {
  addBotText('⏳ 기록 중...');
  const ok = await dispatch({ note: text, section: 'memo' });
  removeLastBotText();
  addBotText(ok ? `✅ 메모로 기록했어요: "${text}"` : '⚠️ 기록 전송에 실패했어요. 네트워크나 토큰을 확인해 주세요.');
}

async function handleSearch(q) {
  const tokens = tokenize(q);
  const { items, broadened } = searchWith(tokens);

  if (getAiSettings().key && items.length) {
    addBotText('⏳ 생각 중...');
    const ai = await callAI(q, items);
    removeLastBotText();
    if (ai.ok) { addBotText(ai.text); renderResults(items, tokens, true); return; }
    addBotText(`⚠️ AI 응답 실패(${ai.error}) — 검색 결과만 보여드릴게요.`);
  } else if (broadened && items.length) {
    addBotText('정확히 일치하는 게 없어 관련 기록으로 넓혀서 찾았어요.');
  }
  renderResults(items, tokens);
}

async function onSend() {
  const inp = document.getElementById('chatInput');
  const q = inp.value.trim();
  if (!q) return;
  addUserText(q);
  inp.value = '';
  if (!getToken()) { addBotText('먼저 GitHub 토큰을 저장해 주세요.'); checkToken(); return; }
  if (!_index.length) { addBotText('아직 기록을 불러오지 못했어요. 🔄 새로고침을 눌러주세요.'); return; }

  const intent = classifyIntent(q);
  if (intent.type === 'place') { await handlePlaceLog(intent.place); return; }
  if (intent.type === 'memo') { await handleMemoLog(q); return; }
  await handleSearch(q);
}

function removeLastBotText() {
  const log = document.getElementById('chatLog');
  const last = log.lastElementChild;
  if (last && last.classList.contains('bot')) log.removeChild(last);
}

// ── 공통 토스트 ───────────────────────────────────────────
let _resultTimer = null;
function showResult(msg, ok) {
  const el = document.getElementById('result');
  el.textContent = msg;
  el.className = ok ? 'ok' : 'err';
  el.style.display = 'block';
  clearTimeout(_resultTimer);
  _resultTimer = setTimeout(() => { el.style.display = 'none'; }, 3500);
}

// ── 초기화 ────────────────────────────────────────────────
document.body.dataset.theme = localStorage.getItem('jarvis_theme_v2') || 'concierge';
addBotText('안녕하세요 사장님 📝 문장으로 편하게 적어주세요 — "신혜식당 갔다옴"처럼 쓰면 자동으로 기록하고, "신혜식당 언제 갔어?"처럼 물어보면 찾아드려요.'
  + (getAiSettings().key ? '' : ' · 🤖 AI 설정에 키를 넣으면 검색도 대화형으로 답해드려요.'));
if (getToken()) buildIndex(false); else checkToken();
</script>

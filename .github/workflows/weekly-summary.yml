name: 주간 자동 요약

on:
  schedule:
    - cron: '0 22 * * 0'   # 매주 월요일 07:00 KST (일요일 22:00 UTC)
  workflow_dispatch:
    inputs:
      ref_date:
        description: '기준일(YYYY-MM-DD) — 비우면 오늘. 지정하면 그 주의 직전 완료된 한 주를 요약'
        required: false

permissions:
  contents: write

jobs:
  weekly-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data

      - name: 주간 요약 생성
        env:
          REF_DATE: ${{ github.event.inputs.ref_date }}
        run: python3 scripts/weekly_summary.py

      - name: Git 커밋 & 푸시
        run: |
          git config user.name "Jarvis"
          git config user.email "jarvis@auto.bot"
          git add weekly/
          git diff --cached --quiet || git commit -m "주간요약 자동생성"
          git push origin HEAD:data

      - name: 텔레그램 알림
        if: env.WEEKLY_SUMMARY != ''
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            --data-urlencode "text=${WEEKLY_SUMMARY}"
